<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-brand" href="#about" aria-label="{{ site.author.name | escape }} homepage">
      <span class="brand-mark" aria-hidden="true">{{ site.author.initials }}</span>
      <span>{{ site.author.name }}</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>
      <span>Menu</span>
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url }}">{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
